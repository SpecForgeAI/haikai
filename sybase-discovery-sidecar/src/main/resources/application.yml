# Sybase Discovery Sidecar - default config.
#
# Override via environment variables (SPRING_*) or a project-level
# application.yml on the classpath. The discovery-service expects the
# sidecar at SYBASE_SIDECAR_URL (default http://localhost:8093).

server:
  port: 8093
  # Limit max body size; introspection responses can be large but a single
  # JSON request body shouldn't exceed 1 MB in practice.
  servlet:
    encoding:
      charset: UTF-8

# Log query category lines only; never log SQL bodies or credentials.
logging:
  level:
    root: INFO
    com.example.sybasesidecar: INFO

# Reasonable JDBC defaults; per-request overrides come from the HTTP body.
sybase:
  default-query-timeout-seconds: 30
  default-max-rows: 1000
