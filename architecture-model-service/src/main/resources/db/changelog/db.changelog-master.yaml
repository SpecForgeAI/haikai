  # Data Entity Point Backfill Migration
  # Backfills Data Entity Points for all existing Logical and Physical Data Entities
  # that do not already have corresponding points.
  # This migration is idempotent - safe to run multiple times.
  # Spec: Data Entity Point Backfill and Legacy Snapshot Compatibility
  - changeSet:
      id: 021-data-entity-points-backfill
      author: architecture-tool
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: data_entity_points
      changes:
        - sqlFile:
            path: db/changelog/sql/021-data-entity-points-backfill.sql
            relativeToChangelogFile: false
            splitStatements: true
            stripComments: true

  # Data Entity Point FK Columns Migration
  # Adds foreign key columns to logical_data_entity_relationships and data_movements
  # that reference data_entity_points(id) for dual-write compatibility.
  # Spec: Add Data Entity Point FK Columns to Logical ER and Data Movements
  - changeSet:
      id: 022-data-entity-point-fk-columns
      author: architecture-tool
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            columnExists:
              tableName: logical_data_entity_relationships
              columnName: from_data_entity_point_id
      changes:
        - sqlFile:
            path: db/changelog/sql/022-data-entity-point-fk-columns.sql
            relativeToChangelogFile: false
            splitStatements: true
            stripComments: true

  # Data Entity Point FK Columns Backfill Migration
  # Backfills the new FK columns for existing rows based on legacy fields.
  # This migration is idempotent - safe to run multiple times.
  # Spec: Add Data Entity Point FK Columns to Logical ER and Data Movements
  - changeSet:
      id: 023-data-entity-point-fk-backfill
