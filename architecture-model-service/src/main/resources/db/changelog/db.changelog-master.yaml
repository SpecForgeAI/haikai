  # Backfill exploits spec #1's deterministic Default rule: architecture.id =
  # project.id (changeset 088). The SQL precondition asserts that every distinct
  # project_id present in discovery_run has a matching architecture row keyed by
  # id = project_id, so the simple UPDATE ... SET architecture_id = project_id is
  # provably correct. If the precondition fails (e.g. 088 was skipped or manual
  # data fixes broke the deterministic-id assumption), the migration HALTs loudly
  # rather than leaving NULL architecture_ids that 095 would later reject.
  - changeSet:
      id: 094-backfill-discovery-runs-architecture-id
      author: architecture-tool
      preConditions:
        - onFail: HALT
        - onError: HALT
        - columnExists:
            tableName: discovery_run
            columnName: architecture_id
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM (
                SELECT DISTINCT dr.project_id
                  FROM discovery_run dr
                 WHERE NOT EXISTS (
                   SELECT 1 FROM architecture a
                    WHERE a.id = dr.project_id
                 )
              ) AS missing_default
      changes:
        - sqlFile:
            path: db/changelog/sql/094-backfill-discovery-runs-architecture-id.sql
            relativeToChangelogFile: false
            splitStatements: true
            stripComments: true

