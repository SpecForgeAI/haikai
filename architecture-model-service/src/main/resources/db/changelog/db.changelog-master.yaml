            stripComments: true

  # Remove Legacy Data Entity Columns Migration - Precondition Checks
  # Contains DO $$ blocks that verify all point-id columns are populated
  # before proceeding with schema modifications.
  # Uses endDelimiter: "$$;" to prevent Liquibase from splitting DO blocks at internal semicolons.
  # Spec: Remove Legacy Data Entity Relationship Columns
  - changeSet:
      id: 024a-remove-legacy-data-entity-columns-preconditions
      author: architecture-tool
      preConditions:
        - onFail: HALT
        - onError: HALT
        - columnExists:
            tableName: logical_data_entity_relationships
