            path: db/changelog/sql/024a-remove-legacy-data-entity-columns-preconditions.sql
            relativeToChangelogFile: false
            splitStatements: true
            stripComments: false
            endDelimiter: "$$;"

  # Remove Legacy Data Entity Columns Migration - Schema Modifications
  # Finalizes the Data Entity Point migration by:
  # - Enforcing NOT NULL on point-id columns
  # - Dropping legacy columns from logical_data_entity_relationships and data_movements
  # Spec: Remove Legacy Data Entity Relationship Columns
