  # ============================================================================
  # Hotfix for Spec #1 / Spec #6 / Spec #7: Auto-derive architecture_id trigger.
  #
  # Spec #1 / Spec #4 added `architecture_id NOT NULL` columns to ~58 tables but
  # only added the JPA `architectureId` field to ModelFileEntity,
  # TemporaryDiagramEntity, and DiscoveryRunEntity. The remaining 56 entities
  # do not write the column on INSERT, which means any new entity (e.g. a new
  # Application) created via JPA fails the NOT NULL constraint.
  #
  # Changeset 097 installs a BEFORE INSERT trigger on every affected table that
  # derives architecture_id from the parent (model_files, sequence_diagrams, or
  # sequence_fragments) when it is NULL. Explicit values from JPA / raw SQL
  # still take priority -- the trigger only fires when the value is NULL.
  #
  # PostgreSQL-only (uses plpgsql functions). The test profile disables
  # Liquibase entirely (H2 + ddl-auto=create-drop), so this changeset is a
  # no-op in tests.
  # ============================================================================

