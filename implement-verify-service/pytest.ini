[pytest]
# Restrict collection to the tests/ tree. Without this, pytest tries to
# collect anything matching test_*.py from the entire repo — including
# src/skills/test_coverage/discovery.py which has a `TestDiscovery` class
# that's production code, not a test (PytestCollectionWarning at import).
testpaths = tests

# tests/manual/ holds opt-in scripts that depend on external setup
# (test_full_metamodel_workflow.py imports a symbol that no longer exists
# after a recent refactor). Exclude from default collection — run
# explicitly via `pytest tests/manual/<file>.py` when intended.
norecursedirs = tests/manual tests/e2e tests/benchmarks .venv venv .venv-local .git node_modules __pycache__ .specforge

# Custom markers — registered so `@pytest.mark.e2e` etc don't emit
# PytestUnknownMarkWarning on every collection. e2e/slow/network were
# referenced in tests/e2e/TEST_PLAN.md.
markers =
    e2e: end-to-end tests requiring network and credentials (slow)
    slow: long-running tests (>30s)
    network: requires outbound network access
